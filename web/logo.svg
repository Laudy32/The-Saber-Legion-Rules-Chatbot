<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="The Saber Legion">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- glow, blade, hilt -->
  <rect x="96" y="12" width="310" height="10" rx="5" fill="#2f8fff" filter="url(#glow)"/>
  <rect x="96" y="13" width="310" height="8" rx="4" fill="url(#blade)"/>
  <rect x="14" y="10" width="86" height="14" rx="3" fill="#3a3f4b"/>
  <rect x="26" y="8" width="8" height="18" rx="2" fill="#8a909c"/>
  <rect x="44" y="10" width="4" height="14" fill="#1f232b"/>
  <rect x="54" y="10" width="4" height="14" fill="#1f232b"/>
  <rect x="64" y="10" width="4" height="14" fill="#1f232b"/>
  <rect x="88" y="7" width="12" height="20" rx="2" fill="#8a909c"/>
  <text x="14" y="78" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-weight="700" font-size="44" letter-spacing="2" textLength="392" lengthAdjust="spacingAndGlyphs" fill="#141a2e">THE SABER LEGION</text>
  <text x="16" y="106" font-family="Lato, Helvetica, Arial, sans-serif" font-weight="700" font-size="17" letter-spacing="5" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#2f6fd6">RULES HELPER</text>
</svg>
